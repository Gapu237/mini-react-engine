<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3 - Skeleton Loader</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
      color: #1f2937;
      background: #f5f7fb;
    }

    section {
      padding: 20px;
      background: white;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    li {
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .skeleton {
      background: linear-gradient(
        90deg,
        #e5e7eb 25%,
        #f9fafb 50%,
        #e5e7eb 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 6px;
      margin: 14px 0;
    }

    .skeleton-title {
      width: 55%;
      height: 28px;
    }

    .skeleton-row {
      width: 100%;
      height: 48px;
    }

    @keyframes shimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main id="app" aria-live="polite"></main>
  <script type="module" src="./app.js"></script>
</body>
</html>
